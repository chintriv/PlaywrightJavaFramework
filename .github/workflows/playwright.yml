name: Playwright Tests

on:
  push:
    branches: [ main, master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - safari

      environment:
        description: 'Environment to run tests on'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - production

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      BROWSER: ${{ github.event.inputs.browser || 'chrome' }}
      TEST_ENV: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build & Install
        run: mvn -B clean install -DskipTests --no-transfer-progress

      - name: Ensure browsers are installed
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      - name: Run tests
        run: mvn test -PFramework -Dbrowser="$BROWSER" -Denv="$TEST_ENV" --no-transfer-progress